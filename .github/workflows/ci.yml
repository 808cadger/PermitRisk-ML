name: CI

on:
  push:
  pull_request:

jobs:
  tabular-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall permitrisk_ml
      - run: python -m permitrisk_ml.make_dataset
      - run: python -m permitrisk_ml.train
